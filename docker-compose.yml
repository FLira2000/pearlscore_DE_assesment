x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://dbt_user:dbt_password@postgres:5432/airflow
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__WEBSERVER__SECRET_KEY: nordstack-dev-secret
    AIRFLOW__SMTP__SMTP_HOST: mailpit
    AIRFLOW__SMTP__SMTP_PORT: "1025"
    AIRFLOW__SMTP__SMTP_MAIL_FROM: airflow@nordstack.local
    AIRFLOW__SMTP__SMTP_STARTTLS: "false"
    AIRFLOW__SMTP__SMTP_SSL: "false"
    AIRFLOW_CONN_SMTP_DEFAULT: smtp://mailpit:1025
    NORDSTACK_ROOT: /opt/nordstack
    NORDSTACK_ALERT_EMAIL: data-eng@nordstack.example
    PYTHON_BIN: python
    PYTHONUNBUFFERED: "1"
    DBT_HOST: postgres
    DBT_PORT: "5432"
    MYSQL_URL: mysql+pymysql://billing_user:billing_password@mysql:3306/billing
    SOURCES__SQL_DATABASE__CREDENTIALS: mysql+pymysql://billing_user:billing_password@mysql:3306/billing
    DESTINATION__POSTGRES__CREDENTIALS: postgresql://dbt_user:dbt_password@postgres:5432/analytics
  volumes:
    - ./dags:/opt/airflow/dags
    - ./airflow/init.sh:/opt/airflow/init.sh:ro
    - .:/opt/nordstack
    - airflow-logs:/opt/airflow/logs
  extra_hosts:
    - "host.docker.internal:host-gateway"
  user: "50000:0"

services:
  # Analytics warehouse — CANDIDATE_BRIEF: Postgres 16 on localhost:5432
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dbt_user
      POSTGRES_PASSWORD: dbt_password
      POSTGRES_DB: analytics
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbt_user -d analytics"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional §0 source OLTP — dlt syncs MySQL → Postgres (analytics)
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: billing
      MYSQL_USER: billing_user
      MYSQL_PASSWORD: billing_password
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Local SMTP catcher for DAG success/failure emails (UI on :8025)
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"
      - "1025:1025"

  airflow-init:
    <<: *airflow-common
    container_name: nordstack-airflow-init
    entrypoint: /bin/bash
    command: ["/opt/airflow/init.sh"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    container_name: nordstack-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')\"",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  airflow-scheduler:
    <<: *airflow-common
    container_name: nordstack-airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  pgdata:
  mysqldata:
  airflow-logs:
